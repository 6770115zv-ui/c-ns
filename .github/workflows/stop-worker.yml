name: Stop worker / workspaces

on:
  workflow_dispatch:
    inputs:
      target:
        description: "What to stop"
        required: false
        default: both
        type: choice
        options: [both, worker, executor, windows]

permissions:
  issues: write

jobs:
  stop:
    runs-on: ubuntu-latest
    steps:
      - name: Request stop
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET: ${{ inputs.target }}
        run: |
          stop_one() {
            local title="$1"
            local n
            n=$(gh api "repos/$REPO/issues?state=open&sort=created&direction=asc&per_page=100" \
                --jq "[.[] | select(.title==\"$title\")][0].number")
            if [ -z "$n" ] || [ "$n" = "null" ]; then echo "$title: not active"; return; fi
            local body
            body=$(printf 'Stop requested\n\n{"state": "stop", "ts": %s}' "$(date +%s)")
            gh api -X PATCH "repos/$REPO/issues/$n" -f body="$body" > /dev/null
            echo "$title: stop requested (#$n)"
          }
          if [ "$TARGET" != "executor" ] && [ "$TARGET" != "windows" ]; then stop_one "[worker-status]"; fi
          if [ "$TARGET" != "worker" ] && [ "$TARGET" != "windows" ]; then stop_one "[executor-status]"; fi
          if [ "$TARGET" = "windows" ] || [ "$TARGET" = "both" ]; then stop_one "[windows-executor-status]"; fi
