name: Start Windows workspace (Administrator)
on:
  workflow_dispatch:
    inputs:
      idle_minutes:
        default: "45"
permissions:
  contents: write
  issues: write
jobs:
  executor:
    runs-on: windows-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -q requests
      - name: Verify Administrator
        shell: pwsh
        run: |
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) { throw "Not Administrator" }
      - name: Run Windows executor
        env:
          GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}
          REPO: \${{ github.repository }}
          OWNER: \${{ github.repository_owner }}
          IDLE_MINUTES: \${{ inputs.idle_minutes }}
        run: python scripts/executor_windows.py
      - name: Final sync
        if: always()
        env:
          GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}
          REPO: \${{ github.repository }}
          OWNER: \${{ github.repository_owner }}
        run: python scripts/executor_windows.py --sync-only
