name: Test agent and UI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: agent-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Check Python syntax
        run: |
          python -m py_compile kaggle/runner.py scripts/executor.py scripts/push_to_kaggle.py scripts/wait_kaggle.py

      - name: Run agent tests
        run: python tests/test_runner.py

      - name: Run UI smoke tests
        run: |
          npm install --no-save --no-audit --no-fund jsdom@26
          node tests/ui_smoke.js
